<html>
<head>
<title>Task 04 - Victoria's Journal</title>
<style>
body
{
background-color: lightgray;
font-family: Arial;
}
#container {
width: 600px;
margin: auto;
background-color: white;
padding: 10px;
border: 1px solid gray;
}
#header 
{
text-align: right;
border-bottom: 2px solid teal;
margin-bottom: 10px;
}
#header h1 
{
color: teal;
margin: 0;
}
#sidebar 
{
float: left;
width: 130px;
background-color: cyan;
padding: 10px;
border: 1px solid teal;
}
#content 
{
float: right;
width: 420px;
}
.box 
{
border: 1px solid teal;
padding: 8px;
margin-bottom: 10px;
}
.box h4 
{
color: teal;
margin-top: 0;
border-bottom: 1px dashed teal;
}
.box img 
{
float: right;
width: 90px;
height: 70px;
}
.clear 
{
clear: both;
}
</style>
</head>
<body>
<div id="container">
<!-- Header -->
<div id="header">
<h1>Victoria's Journal</h1>
<p>so fresh and so clean</p>
</div>
<!-- Sidebar (Left) -->
<div id="sidebar">
<h3>Friends</h3>
<ul>
<li>spatula</li>
<li>cookie</li>
<li>cupcake</li>
</ul>
</div>
<!-- Content (Right) -->
<div id="content">
<!-- Box 1 -->
<div class="box">
<h4>04/09/08: Spatulas</h4>
<img src="spatula.jpg" alt="Spatula"/>
<p>Yesterday I went to the store and got some much-needed spatulas!</p>
<div class="clear"></div>
</div>
<!-- Box 2 -->
<div class="box">
<h4>04/08/08: Cookie Cupcakes</h4>
<img src="cupcake.jpg" alt="Cupcakes"/>
<p>My favorite cartoon character is Cookie, and my favorite dessert is cupcakes.</p>
<div class="clear"></div>
</div>
</div>
<div class="clear"></div>
</div>
</body>
</html>
